name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Unit tests only — smoke tests need live credentials and are run locally.
      - run: npm run test:coverage
      - run: npm run build
      - name: Coverage report in job summary
        if: matrix.node-version == '22.x'
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | % | Covered / Total |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"' \
            coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
